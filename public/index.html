<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delta</title><style>body{font:16px system-ui;background:#f4f4f2;color:#252621;max-width:760px;margin:8vh auto;padding:24px}h1{font-size:32px}label{display:block;margin:20px 0 8px}textarea,input,select,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;border:1px solid #bcbdb5;border-radius:4px;background:white}textarea{min-height:200px}button{width:auto;margin-top:18px;background:#292c26;color:white}p{line-height:1.6;color:#555}</style></head><body><h1 data-i18n="heading"></h1><p data-i18n="privacy"></p><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off"><label for="lang" data-i18n="language"></label><input id="lang" value="und" placeholder="de-DE, ru, en, ja…" maxlength="48"><textarea id="text" spellcheck="false"></textarea><button id="send" data-i18n="send"></button><p id="status" role="status"></p><script type="module">
const uiLanguage=new URLSearchParams(location.search).get('lang')||localStorage.getItem('delta.language')||'en';document.documentElement.lang=uiLanguage==='ru'?'ru':'en';const ru=await fetch('/'+document.documentElement.lang+'.json').then(r=>r.json());document.title=ru.title;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=ru[e.dataset.i18n]);const text=document.querySelector('#text'),status=document.querySelector('#status'),lang=document.querySelector('#lang');text.placeholder=ru.placeholder;status.textContent=ru.statusReady;
const options=await fetch('/options').then(r=>r.json());
let start=0,last=0,chars=0,corrections=0,activeMs=0,speedCharacters=0,bursts=0,pauses=0,burstStart=0,longestBurstMs=0,id=crypto.randomUUID(),submitting=false;
function record(count,deletion=false){const now=Date.now(),gap=last?now-last:null;if(!start){start=now;lang.disabled=true;}if(gap!==null&&gap<=options.idleThresholdMs){activeMs+=gap;if(!deletion)speedCharacters+=count;longestBurstMs=Math.max(longestBurstMs,now-burstStart);}else{bursts++;if(gap!==null)pauses++;burstStart=now;}last=now;if(deletion)corrections++;else chars+=count;}
text.addEventListener('paste',e=>{e.preventDefault();status.textContent=ru.statusPaste});text.addEventListener('drop',e=>e.preventDefault());
text.addEventListener('compositionend',e=>{if(e.data)record(Array.from(e.data).length)});
text.addEventListener('beforeinput',e=>{if(e.isComposing||e.inputType==='insertCompositionText'||e.inputType==='insertFromComposition')return;if(e.inputType.startsWith('insert'))record(Array.from(e.data||'\n').length);if(e.inputType.startsWith('delete'))record(0,true)});
document.querySelector('#send').onclick=async()=>{if(submitting)return;if(!start||!chars){status.textContent=ru.statusEmpty;return}let language;try{language=Intl.getCanonicalLocales(lang.value)[0]}catch{status.textContent=ru.statusLanguage;return}submitting=true;text.disabled=true;try{const words=[];if(options.recordWords){const counts=new Map();for(const s of new Intl.Segmenter(language,{granularity:'word'}).segment(text.value)){if(!s.isWordLike||!/[\p{L}]/u.test(s.segment))continue;const word=s.segment.normalize('NFKC').toLocaleLowerCase(language);if(word.length<=64)counts.set(word,(counts.get(word)||0)+1);}for(const [word,count] of counts)words.push({word,count,language});}const endedAt=Math.max(start+1,last);const r=await fetch('/sessions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+document.querySelector('#token').value},body:JSON.stringify({id,startedAt:start,endedAt,language,characters:chars,corrections,activeMs:options.excludeIdle?activeMs:endedAt-start,speedCharacters:options.excludeIdle?speedCharacters:chars,bursts,pauses,longestBurstMs,words,mode:'trainer',node:'trainer'})});if(!r.ok)throw Error();text.value='';start=last=chars=corrections=activeMs=speedCharacters=bursts=pauses=burstStart=longestBurstMs=0;id=crypto.randomUUID();lang.disabled=false;status.textContent=ru.statusSent;}catch{status.textContent=ru.statusError}finally{submitting=false;text.disabled=false}};
</script></body></html>
