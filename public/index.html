<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delta</title><style>body{font:16px system-ui;background:#f4f4f2;color:#252621;max-width:760px;margin:8vh auto;padding:24px}h1{font-size:32px}label{display:block;margin:20px 0 8px}textarea,input,select,button{font:inherit;padding:12px;box-sizing:border-box;width:100%;border:1px solid #bcbdb5;border-radius:4px;background:white}textarea{min-height:200px}button{width:auto;margin-top:18px;background:#292c26;color:white}p{line-height:1.6;color:#555}</style></head><body><h1 data-i18n="heading"></h1><p data-i18n="privacy"></p><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="off"><label for="lang" data-i18n="language"></label><select id="lang"><option value="ru" data-i18n="ru"></option><option value="en" data-i18n="en"></option></select><textarea id="text" spellcheck="false"></textarea><button id="send" data-i18n="send"></button><p id="status" role="status"></p><script type="module">
const ru=await fetch('/ru.json').then(r=>r.json());document.title=ru.title;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=ru[e.dataset.i18n]);const text=document.querySelector('#text'),status=document.querySelector('#status'),lang=document.querySelector('#lang');text.placeholder=ru.placeholder;status.textContent=ru.statusReady;
let start=0,chars=0,corrections=0,ime=false,id=crypto.randomUUID(),finished,submitting=false;
text.addEventListener('compositionstart',()=>{ime=true;status.textContent=ru.statusIME});
text.addEventListener('beforeinput',e=>{if(e.isComposing)return;if(e.inputType.startsWith('insert')){if(!start)start=Date.now();chars+=e.data?.length||1;lang.disabled=true;}if(e.inputType.startsWith('delete'))corrections++});
document.querySelector('#send').onclick=async()=>{if(submitting)return;if(ime){status.textContent=ru.statusIME;return}if(!start||!chars){status.textContent=ru.statusEmpty;return}submitting=true;finished??=Date.now();text.disabled=true;try{const r=await fetch('/sessions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+document.querySelector('#token').value},body:JSON.stringify({id,startedAt:start,endedAt:Math.max(start+1,finished),language:lang.value,characters:chars,corrections:Math.min(chars,corrections),node:'trainer'})});if(!r.ok)throw Error();text.value='';start=chars=corrections=0;finished=undefined;id=crypto.randomUUID();lang.disabled=false;status.textContent=ru.statusSent;}catch{status.textContent=ru.statusError}finally{submitting=false;text.disabled=false}};
</script></body></html>
