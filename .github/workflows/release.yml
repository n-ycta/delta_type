name: Release plugin package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./server/windows-input.ps1 -SelfTest
  release:
    needs: windows-helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 xkb-data
      - run: npm test
      - run: tar --exclude='server/launch.mjs' --exclude='__pycache__' --exclude='*.pyc' -czf delta_type.tar.gz manifest.json package.json package-lock.json server LICENSE NOTICE public locales
      - run: sha256sum delta_type.tar.gz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=v$(node -p "require('./package.json').version")
          python3 scripts/release-notes.py "$TAG" > release-notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "delta_type $TAG" --notes-file release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
          gh release upload "$TAG" delta_type.tar.gz SHA256SUMS --clobber
